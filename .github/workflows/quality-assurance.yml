name: Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions: {}

jobs:
  static-analysis:
    name: Static Analysis
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.4","8.5"]'
      extensions: "soap, libxml, mbstring"
      coverage: "none"
      phpstan-cmd: 'vendor/bin/phpstan analyse --no-progress --error-format=github && vendor/bin/phpcs && vendor/bin/phpmd src text phpmd.xml'
      run-phpunit: false

  tests:
    name: Tests
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.4","8.5"]'
      extensions: "soap, libxml, mbstring"
      coverage: "xdebug"
      run-phpstan: false
      # Unit suite (with Clover coverage) must pass; the integration suite and
      # the network group both replay committed VCR cassettes without touching
      # the network, so all three must pass. The network group is excluded from
      # the default run by phpunit.xml and has to be selected explicitly --
      # leaving it out of CI is what once let a broken SOAP fault mapping ship
      # behind a green badge.
      phpunit-cmd: 'vendor/bin/phpunit --testsuite=unit --coverage-clover=coverage.xml && USE_PRODUCTION_ENDPOINT=false REFRESH_CASSETTES=false vendor/bin/phpunit --testsuite=integration --no-coverage && USE_PRODUCTION_ENDPOINT=false REFRESH_CASSETTES=false vendor/bin/phpunit --group network --no-coverage'
      upload-coverage-codecov: true
      coverage-php-version: "8.4"
      coverage-file: "./coverage.xml"
      coverage-flags: "unittests"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  tests-lowest:
    name: Tests (lowest deps)
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.4"]'
      extensions: "soap, libxml, mbstring"
      coverage: "none"
      run-phpstan: false
      # Resolves every constraint to its floor instead of its ceiling. Without
      # this leg a lower bound is a claim rather than a tested fact: there is no
      # lockfile, so the normal run always installs the newest set and can never
      # exercise the oldest one. That is how `php-vcr >=1.6.4` and
      # `symfony/event-dispatcher ^6.0` sat here declared-but-broken -- at their
      # floors both emit PHP 8.4 implicit-nullable deprecations that ext-soap
      # turns into a failed SOAP call.
      dependency-versions: "lowest"
      phpunit-cmd: 'vendor/bin/phpunit --testsuite=unit --no-coverage && USE_PRODUCTION_ENDPOINT=false REFRESH_CASSETTES=false vendor/bin/phpunit --testsuite=integration --no-coverage && USE_PRODUCTION_ENDPOINT=false REFRESH_CASSETTES=false vendor/bin/phpunit --group network --no-coverage'

  security:
    name: Security Scan
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.4"]'
      extensions: "soap, libxml"
      run-composer-audit: true
      run-phpstan: false
      run-phpunit: false

  rector:
    name: Rector Checks
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.4"]'
      extensions: "soap, libxml"
      run-rector: true
      run-phpstan: false
      run-phpunit: false
