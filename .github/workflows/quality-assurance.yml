name: Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions: {}

jobs:
  static-analysis:
    name: Static Analysis
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4"]'
      extensions: "soap, libxml, mbstring"
      coverage: "none"
      phpstan-cmd: 'vendor/bin/phpstan analyse --no-progress --error-format=github && vendor/bin/phpcs && vendor/bin/phpmd src text phpmd.xml'
      run-phpunit: false

  tests:
    name: Tests
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4"]'
      extensions: "soap, libxml, mbstring"
      coverage: "xdebug"
      run-phpstan: false
      # Unit suite (with Clover coverage) must pass; the integration suite and
      # the network group both replay committed VCR cassettes without touching
      # the network, so all three must pass. The network group is excluded from
      # the default run by phpunit.xml and has to be selected explicitly --
      # leaving it out of CI is what once let a broken SOAP fault mapping ship
      # behind a green badge.
      phpunit-cmd: 'vendor/bin/phpunit --testsuite=unit --coverage-clover=coverage.xml && USE_PRODUCTION_ENDPOINT=false REFRESH_CASSETTES=false vendor/bin/phpunit --testsuite=integration --no-coverage && USE_PRODUCTION_ENDPOINT=false REFRESH_CASSETTES=false vendor/bin/phpunit --group network --no-coverage'
      upload-coverage-codecov: true
      coverage-php-version: "8.2"
      coverage-file: "./coverage.xml"
      coverage-flags: "unittests"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Scan
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2"]'
      extensions: "soap, libxml"
      run-composer-audit: true
      run-phpstan: false
      run-phpunit: false

  rector:
    name: Rector Checks
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2"]'
      extensions: "soap, libxml"
      run-rector: true
      run-phpstan: false
      run-phpunit: false

  performance:
    name: Performance Benchmarks
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2"]'
      extensions: "soap, libxml"
      run-phpstan: false
      phpunit-cmd: 'USE_PRODUCTION_ENDPOINT=false vendor/bin/phpunit tests/Integration/PerformanceBenchmarkTest.php --no-coverage'
